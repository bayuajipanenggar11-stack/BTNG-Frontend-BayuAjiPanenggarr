<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-offroad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="line-offroad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="shadow-offroad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-offroad)"/>
  <line x1="80" y1="360" x2="720" y2="360" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 8"/>
  <ellipse cx="400" cy="360" rx="260" ry="16" fill="url(#shadow-offroad)"/>
  
  <!-- Boxy Rugged 4x4 / Jimny Profile -->
  <path d="M 230 320 
           L 210 300 
           L 210 240 
           L 230 240 
           L 240 185 
           L 540 185 
           L 550 250 
           L 600 250 
           L 600 320
           L 560 320
           A 44 44 0 0 0 472 320
           L 358 320
           A 44 44 0 0 0 270 320
           Z" 
        fill="#FFFFFF" stroke="url(#line-offroad)" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Boxy Windows -->
  <path d="M 255 195 
           L 530 195 
           L 535 240 
           L 245 240 
           Z" 
        fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="390" y1="195" x2="390" y2="240" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Spare tire on back -->
  <path d="M 200 230 C 190 230, 190 290, 200 290 Z" fill="#1E293B"/>

  <!-- High Clearance Wheels -->
  <circle cx="314" cy="320" r="38" fill="#1E293B" stroke="#64748B" stroke-width="5"/>
  <circle cx="314" cy="320" r="16" fill="#E2E8F0"/>
  <circle cx="516" cy="320" r="38" fill="#1E293B" stroke="#64748B" stroke-width="5"/>
  <circle cx="516" cy="320" r="16" fill="#E2E8F0"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">MOTIONBAY STUDIO // ARCHIVE SILHOUETTE</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#0F172A">RUGGED LADDER-FRAME 4x4 ARCHITECTURE</text>
</svg>