<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-ev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="line-ev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="shadow-ev" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-ev)"/>
  <line x1="120" y1="360" x2="680" y2="360" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 8"/>
  <ellipse cx="400" cy="360" rx="220" ry="14" fill="url(#shadow-ev)"/>
  
  <!-- Micro / Compact City EV Profile -->
  <path d="M 270 330 
           L 275 250 
           L 330 200 
           L 470 200 
           L 520 230 
           L 530 330
           L 490 330
           A 36 36 0 0 0 418 330
           L 382 330
           A 36 36 0 0 0 310 330
           Z" 
        fill="#FFFFFF" stroke="url(#line-ev)" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Greenhouse Windows -->
  <path d="M 340 210 
           L 460 210 
           L 505 240 
           L 320 250 
           Z" 
        fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="410" y1="210" x2="410" y2="250" stroke="#BAE6FD" stroke-width="1.5"/>

  <!-- Wheels -->
  <circle cx="346" cy="330" r="28" fill="#1E293B" stroke="#0284C7" stroke-width="3"/>
  <circle cx="346" cy="330" r="12" fill="#E2E8F0"/>
  <circle cx="454" cy="330" r="28" fill="#1E293B" stroke="#0284C7" stroke-width="3"/>
  <circle cx="454" cy="330" r="12" fill="#E2E8F0"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0284C7" letter-spacing="3">MOTIONBAY STUDIO // ARCHIVE SILHOUETTE</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#0F172A">URBAN MICRO-EV ARCHITECTURE</text>
</svg>