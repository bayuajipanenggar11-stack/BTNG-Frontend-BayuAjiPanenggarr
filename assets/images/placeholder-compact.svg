<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-compact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="line-compact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="shadow-compact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-compact)"/>
  <line x1="80" y1="360" x2="720" y2="360" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 8"/>
  <ellipse cx="400" cy="360" rx="300" ry="16" fill="url(#shadow-compact)"/>
  
  <!-- Hatchback / Compact Profile -->
  <path d="M 180 325 
           L 185 285 
           L 260 275 
           L 340 215 
           L 540 215 
           L 610 275 
           L 630 325
           L 580 325
           A 40 40 0 0 0 500 325
           L 320 325
           A 40 40 0 0 0 240 325
           Z" 
        fill="#FFFFFF" stroke="url(#line-compact)" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Greenhouse Windows -->
  <path d="M 345 225 
           L 535 225 
           L 590 270 
           L 325 270 
           Z" 
        fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="435" y1="225" x2="435" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Wheels -->
  <circle cx="280" cy="325" r="32" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
  <circle cx="280" cy="325" r="14" fill="#E2E8F0"/>
  <circle cx="540" cy="325" r="32" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
  <circle cx="540" cy="325" r="14" fill="#E2E8F0"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">MOTIONBAY STUDIO // ARCHIVE SILHOUETTE</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#0F172A">COMPACT &amp; HATCHBACK ARCHITECTURE</text>
</svg>