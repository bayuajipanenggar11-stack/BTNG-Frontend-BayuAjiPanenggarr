<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-suv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="line-suv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="shadow-suv" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-suv)"/>
  <line x1="80" y1="360" x2="720" y2="360" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 8"/>
  <ellipse cx="400" cy="360" rx="330" ry="16" fill="url(#shadow-suv)"/>
  
  <!-- SUV Profile -->
  <path d="M 150 325 
           L 155 270 
           L 240 265 
           L 320 200 
           L 580 200 
           L 640 250 
           L 655 325
           L 595 325
           A 44 44 0 0 0 507 325
           L 303 325
           A 44 44 0 0 0 215 325
           Z" 
        fill="#FFFFFF" stroke="url(#line-suv)" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Greenhouse Windows -->
  <path d="M 325 210 
           L 570 210 
           L 620 255 
           L 310 255 
           Z" 
        fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="430" y1="210" x2="430" y2="255" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="520" y1="210" x2="520" y2="255" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Wheels -->
  <circle cx="261" cy="325" r="36" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
  <circle cx="261" cy="325" r="16" fill="#E2E8F0"/>
  <circle cx="551" cy="325" r="36" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
  <circle cx="551" cy="325" r="16" fill="#E2E8F0"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">MOTIONBAY STUDIO // ARCHIVE SILHOUETTE</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#0F172A">FULL-SIZE &amp; MID SUV ARCHITECTURE</text>
</svg>